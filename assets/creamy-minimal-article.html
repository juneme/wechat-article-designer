  <section style="box-sizing:border-box;margin:0 20px;padding:0;text-align:center;">

  </section>

  <section style="box-sizing:border-box;margin:44px 20px 0;padding:0;text-align:center;">

    <p style="margin:10px 0 0;font-size:19px;line-height:1.6;font-weight:800;color:#5A4632;">{{SECTION_2_TITLE}}</p>
    <p style="margin:10px 0 0;font-size:14px;line-height:2;color:#9A8268;">{{SECTION_2_BODY}}</p>
  </section>

  <p style="margin:34px 20px 0;padding:14px 0 0;border-top:1px solid #EBDDC8;font-size:12px;line-height:1.8;color:#B98A5E;letter-spacing:2px;text-align:center;">{{CLOSING}}</p>
