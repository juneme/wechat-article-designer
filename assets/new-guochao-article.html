<section style="box-sizing:border-box;margin:0;padding:20px 0 32px;background:#F6EEDC;background:linear-gradient(180deg,#F6EEDC 0%,#F2E4C9 100%);color:#2E2620;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;line-height:1.9;overflow:hidden;">
