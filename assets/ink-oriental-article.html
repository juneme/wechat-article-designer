<!-- Generic structural starter. Replace every {{TOKEN}} and adapt section count to the article. -->
<!-- 微信公众号复制开始 -->
<section style="box-sizing:border-box;margin:0;padding:0 0 34px;background:#FAF7F2;color:#1E1B18;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;line-height:2;overflow:hidden;">
  <section style="box-sizing:border-box;margin:0 8px;padding:42px 8px 38px;text-align:center;">
    <p style="margin:0;font-size:11px;line-height:1.6;color:#8A857D;letter-spacing:4px;">{{EYEBROW}}</p>
    <p style="margin:25px 0 0;font-size:42px;line-height:1.35;font-weight:300;color:#1E1B18;letter-spacing:5px;">{{TITLE}}</p>
    <p style="margin:9px 0 0;font-size:16px;line-height:1.9;color:#5C564E;letter-spacing:2px;">{{SUBTITLE}}</p>
    <p style="margin:26px auto 0;width:36px;height:2px;background:#A63A2E;font-size:0;line-height:0;">&nbsp;</p>
  </section>

  <section style="box-sizing:border-box;margin:30px 16px 0;padding:26px 14px;border-top:1px solid #E0DACF;">
    <p style="margin:0;font-size:0;line-height:1;"><span style="display:inline-block;font-size:12px;line-height:1;color:#A63A2E;font-weight:800;letter-spacing:2px;">{{SECTION_1_NUMBER}}</span><span style="display:inline-block;width:1px;height:13px;margin:0 12px;background:#C9C2B6;vertical-align:middle;"></span><span style="display:inline-block;font-size:12px;line-height:1;color:#8A857D;letter-spacing:2px;vertical-align:middle;">{{SECTION_1_LABEL}}</span></p>
    <p style="margin:18px 0 0;font-size:24px;line-height:1.5;font-weight:600;color:#1E1B18;letter-spacing:1px;">{{SECTION_1_TITLE}}</p>
    <p style="margin:16px 0 0;font-size:15px;line-height:2.1;color:#5C564E;">{{SECTION_1_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:28px 16px 0;padding:24px 20px;background:#F1ECE2;border-left:3px solid #A63A2E;">
    <p style="margin:0;font-size:12px;line-height:1.6;color:#A63A2E;font-weight:800;letter-spacing:2px;">{{SECTION_2_LABEL}}</p>
    <p style="margin:10px 0 0;font-size:18px;line-height:1.7;color:#1E1B18;font-weight:600;">{{SECTION_2_TITLE}}</p>
    <p style="margin:10px 0 0;font-size:14px;line-height:2;color:#5C564E;">{{SECTION_2_BODY}}</p>
  </section>

  <p style="margin:30px 20px 0;font-size:13px;line-height:2.2;color:#1E1B18;letter-spacing:2px;text-align:center;">{{CLOSING}}</p>
</section>
<!-- 微信公众号复制结束 -->
