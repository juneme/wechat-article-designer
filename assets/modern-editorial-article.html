<!-- Generic structural starter. Replace every {{TOKEN}} and adapt section count to the article. -->
<!-- 微信公众号复制开始 -->
<section style="box-sizing:border-box;margin:0;padding:18px 0 32px;background:#F4EDDB;color:#3A332B;font-family:Georgia,'Times New Roman','PingFang SC','Microsoft YaHei',serif;line-height:1.9;overflow:hidden;">
  <section style="box-sizing:border-box;margin:0 16px;padding:0;border-top:3px double #3A332B;border-bottom:1px solid #3A332B;text-align:center;">
    <p style="margin:0;padding:14px 0 4px;font-size:10px;line-height:1.5;color:#8A7E68;letter-spacing:3px;">{{PUBLICATION_LINE}}</p>
    <p style="margin:0;padding:2px 0 8px;font-size:38px;line-height:1.15;font-weight:900;color:#2E2820;letter-spacing:2px;">{{MASTHEAD}}</p>
    <p style="margin:0;padding:0 0 8px;font-size:10px;line-height:1.5;color:#8A7E68;letter-spacing:1px;">{{DATE_OR_DECK}}</p>
  </section>

  <section style="box-sizing:border-box;margin:20px 16px 0;padding:16px 14px;border-left:4px solid #8C3B2E;border-right:1px solid #D6C9AE;background:#EDE3CC;">
    <p style="margin:0;font-size:11px;line-height:1.6;color:#8C3B2E;font-weight:800;letter-spacing:2px;">{{LEAD_LABEL}}</p>
    <p style="margin:10px 0 0;font-size:26px;line-height:1.35;font-weight:900;color:#2E2820;">{{LEAD_TITLE}}</p>
    <p style="margin:12px 0 0;font-size:14px;line-height:2;color:#5C5242;">{{LEAD_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:18px 16px 0;padding:14px 12px 12px;border:1px solid #CFC2A6;border-top:3px solid #8C3B2E;background:#FAF5E8;">
    <p style="margin:0;font-size:10px;line-height:1.5;color:#8A7E68;letter-spacing:2px;">{{COLUMN_1_LABEL}}</p>
    <p style="margin:8px 0 0;font-size:18px;line-height:1.5;font-weight:800;color:#2E2820;">{{COLUMN_1_TITLE}}</p>
    <p style="margin:8px 0 0;font-size:13px;line-height:2;color:#5C5242;">{{COLUMN_1_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:16px 16px 0;padding:14px 12px 12px;border:1px solid #CFC2A6;border-top:3px solid #8C3B2E;background:#FAF5E8;">
    <p style="margin:0;font-size:10px;line-height:1.5;color:#8A7E68;letter-spacing:2px;">{{COLUMN_2_LABEL}}</p>
    <p style="margin:8px 0 0;font-size:18px;line-height:1.5;font-weight:800;color:#2E2820;">{{COLUMN_2_TITLE}}</p>
    <p style="margin:8px 0 0;font-size:13px;line-height:2;color:#5C5242;">{{COLUMN_2_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:20px 16px 0;padding:10px 12px;background:#3A332B;color:#F3E9D2;text-align:center;">
    <p style="margin:0;font-size:11px;line-height:1.8;letter-spacing:2px;">{{CLOSING}}</p>
  </section>
</section>
<!-- 微信公众号复制结束 -->
