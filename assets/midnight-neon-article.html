<!-- Generic structural starter. Replace every {{TOKEN}} and adapt section count to the article. -->

<section style="box-sizing:border-box;margin:0;padding:0 0 30px;background:#12102A;background:linear-gradient(180deg,#12102A 0%,#0E0B1F 100%);color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;line-height:1.9;overflow:hidden;">
  <section style="box-sizing:border-box;margin:0 8px;padding:0;background:#1D1A3A;border:2px solid #2A2550;border-radius:14px;box-shadow:0 14px 32px rgba(0,0,0,.34);overflow:hidden;">
    <section style="box-sizing:border-box;margin:0;padding:24px 20px 26px;">
      <p style="box-sizing:border-box;margin:0;padding:6px 12px;width:156px;background:#41E2FF;border-radius:999px;font-size:11px;line-height:1.4;font-weight:900;color:#0E0B1F;text-align:center;">{{EYEBROW}}</p>
      <p style="margin:20px 0 0;font-size:36px;line-height:1.2;font-weight:900;color:#FFFFFF;">{{TITLE_LINE_1}}<br><span style="color:#41E2FF;">{{TITLE_LINE_2}}</span></p>
      <p style="margin:14px 0 0;font-size:14px;line-height:1.9;color:#B9B4E6;">{{INTRO}}</p>
    </section>
    <p style="margin:0;padding:11px 20px;background:#FF4D8D;font-size:12px;line-height:1.7;font-weight:900;color:#0E0B1F;">{{KEY_INFO}}</p>
  </section>

  <section style="box-sizing:border-box;margin:20px 8px 0;padding:0;background:#1D1A3A;border:2px solid #2A2550;border-radius:14px;overflow:hidden;">
    <section style="box-sizing:border-box;margin:0;padding:17px 16px;border-left:6px solid #41E2FF;">
      <p style="margin:0;font-size:11px;line-height:1.5;font-weight:900;color:#41E2FF;">{{SECTION_1_LABEL}}</p>
      <p style="margin:5px 0 0;font-size:22px;line-height:1.35;font-weight:900;color:#FFFFFF;">{{SECTION_1_TITLE}}</p>
      <p style="margin:9px 0 0;font-size:14px;line-height:1.9;color:#B9B4E6;">{{SECTION_1_BODY}}</p>
    </section>
    <section style="box-sizing:border-box;margin:0;padding:17px 16px;border-left:6px solid #FF4D8D;border-top:1px solid #2A2550;">
      <p style="margin:0;font-size:11px;line-height:1.5;font-weight:900;color:#FF4D8D;">{{SECTION_2_LABEL}}</p>
      <p style="margin:5px 0 0;font-size:22px;line-height:1.35;font-weight:900;color:#FFFFFF;">{{SECTION_2_TITLE}}</p>
      <p style="margin:9px 0 0;font-size:14px;line-height:1.9;color:#B9B4E6;">{{SECTION_2_BODY}}</p>
    </section>
  </section>

  <section style="box-sizing:border-box;margin:20px 8px 0;padding:19px 18px;background:#0E0B1F;border:2px solid #41E2FF;border-radius:14px;box-shadow:0 10px 24px rgba(65,226,255,.14);">
    <p style="margin:0;font-size:11px;line-height:1.5;font-weight:900;color:#41E2FF;">{{CTA_LABEL}}</p>
    <p style="margin:8px 0 0;font-size:20px;line-height:1.5;font-weight:900;color:#FFFFFF;">{{CTA_TITLE}}</p>
    <p style="margin:8px 0 0;font-size:13px;line-height:1.9;color:#B9B4E6;">{{CTA_BODY}}</p>
  </section>
</section>
