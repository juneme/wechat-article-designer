<!-- Generic structural starter. Replace every {{TOKEN}} and adapt section count to the article. -->
<!-- 微信公众号复制开始 -->
<section style="box-sizing:border-box;margin:0;padding:0 0 30px;background:#FDF6F2;color:#5B4A44;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;line-height:1.9;overflow:hidden;">
  <section style="box-sizing:border-box;margin:0 8px;padding:25px 20px 28px;background:#F9C9DE;background:linear-gradient(145deg,#F9C9DE 0%,#FBE3B6 100%);border-radius:28px;box-shadow:0 12px 28px rgba(194,123,150,.18);text-align:center;">
    <p style="box-sizing:border-box;margin:0 auto;padding:6px 12px;width:138px;background:#FFFFFF;border-radius:999px;font-size:11px;line-height:1.4;font-weight:800;color:#C27B96;">{{EYEBROW}}</p>
    <p style="margin:18px 0 0;font-size:30px;line-height:1.4;font-weight:900;color:#5B4A44;">{{TITLE_LINE_1}}<br>{{TITLE_LINE_2}}</p>
    <p style="margin:12px 0 0;font-size:14px;line-height:1.9;color:#8C6A78;">{{INTRO}}</p>
  </section>

  <section style="box-sizing:border-box;margin:17px 8px 0;padding:18px 16px;background:#C8EFE0;border-radius:22px;">
    <p style="margin:0;font-size:0;line-height:1;"><span style="display:inline-block;width:10px;height:10px;margin-right:10px;background:#FFFFFF;border-radius:50%;vertical-align:middle;"></span><span style="display:inline-block;font-size:17px;line-height:1.5;font-weight:900;color:#5B4A44;vertical-align:middle;">{{ITEM_1_TITLE}}</span></p>
    <p style="margin:8px 0 0 20px;font-size:14px;line-height:1.9;color:#6E8A7C;">{{ITEM_1_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:14px 8px 0;padding:18px 16px;background:#E6DFFA;border-radius:22px;">
    <p style="margin:0;font-size:0;line-height:1;"><span style="display:inline-block;width:10px;height:10px;margin-right:10px;background:#FFFFFF;border-radius:50%;vertical-align:middle;"></span><span style="display:inline-block;font-size:17px;line-height:1.5;font-weight:900;color:#5B4A44;vertical-align:middle;">{{ITEM_2_TITLE}}</span></p>
    <p style="margin:8px 0 0 20px;font-size:14px;line-height:1.9;color:#7A6E9C;">{{ITEM_2_BODY}}</p>
  </section>

  <section style="box-sizing:border-box;margin:18px 8px 0;padding:19px 18px;background:#F9C9DE;border-radius:24px;box-shadow:0 10px 24px rgba(194,123,150,.15);text-align:center;">
    <p style="margin:0;font-size:19px;line-height:1.6;font-weight:900;color:#5B4A44;">{{CTA_TITLE}}</p>
    <p style="margin:8px 0 0;font-size:12px;line-height:1.8;color:#8C6A78;">{{CTA_BODY}}</p>
  </section>
</section>
<!-- 微信公众号复制结束 -->
