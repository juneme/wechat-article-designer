<!-- Generic structural starter. Replace every {{TOKEN}} and adapt section count to the article. -->

<section style="box-sizing:border-box;margin:0;padding:0 0 30px;background:#F6F1E7;color:#3E362E;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif;line-height:1.9;overflow:hidden;">
  <section style="box-sizing:border-box;margin:0 8px;padding:23px 20px 26px;background:#8A6D4B;border-radius:14px;overflow:hidden;">
    <p style="box-sizing:border-box;margin:0;padding:6px 12px;width:126px;background:#6E9B6B;border-radius:999px;font-size:11px;line-height:1.4;font-weight:900;color:#FFFFFF;text-align:center;">{{EYEBROW}}</p>
    <p style="margin:20px 0 0;font-size:33px;line-height:1.3;font-weight:900;color:#FFFFFF;">{{TITLE_LINE_1}}<br><span style="color:#E8D9B8;">{{TITLE_LINE_2}}</span></p>
    <p style="margin:14px 0 0;font-size:14px;line-height:1.9;color:#EFE4D2;">{{INTRO}}</p>
  </section>

  <section style="box-sizing:border-box;margin:18px 8px 0;padding:0;background:#FFFFFF;border:1px solid #E3D9C8;border-radius:16px;overflow:hidden;">
    <section style="box-sizing:border-box;margin:0;padding:16px 17px;border-left:6px solid #6E9B6B;border-bottom:1px solid #EFE7D8;">
      <p style="margin:0;font-size:17px;line-height:1.55;color:#3E362E;font-weight:900;">{{ITEM_1_TITLE}}</p>
      <p style="margin:6px 0 0;font-size:14px;line-height:1.85;color:#7A6E5C;">{{ITEM_1_BODY}}</p>
    </section>
    <section style="box-sizing:border-box;margin:0;padding:16px 17px;border-left:6px solid #C9A15F;">
      <p style="margin:0;font-size:17px;line-height:1.55;color:#3E362E;font-weight:900;">{{ITEM_2_TITLE}}</p>
      <p style="margin:6px 0 0;font-size:14px;line-height:1.85;color:#7A6E5C;">{{ITEM_2_BODY}}</p>
    </section>
  </section>

  <section style="box-sizing:border-box;margin:18px 8px 0;padding:18px;background:#6E9B6B;border-radius:14px;">
    <p style="margin:0;font-size:11px;line-height:1.5;font-weight:900;color:#E8F1E6;letter-spacing:1px;">{{CTA_LABEL}}</p>
    <p style="margin:8px 0 0;font-size:20px;line-height:1.5;font-weight:900;color:#FFFFFF;">{{CTA_TITLE}}</p>
    <p style="margin:8px 0 0;font-size:13px;line-height:1.9;color:#E8F1E6;">{{CTA_BODY}}</p>
  </section>
</section>
