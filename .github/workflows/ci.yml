name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill metadata
        run: >-
          python -B -c "from pathlib import Path; text=Path('SKILL.md').read_text(encoding='utf-8'); front=text.split('---',2)[1]; assert 'name: yunoe' in front; assert 'description:' in front"

      - name: Parse lightweight client
        run: python -B -m py_compile scripts/wechat_console.py

      - name: Reject development-only test files
        run: |
          tracked_tests="$(git ls-files | grep -E '(^|/)tests?/|(^|/)test_[^/]*\.py$' || true)"
          if [[ -n "$tracked_tests" ]]; then
            echo "Development-only test files must not enter the public repository:" >&2
            echo "$tracked_tests" >&2
            exit 1
          fi

      - name: Build skill release archive
        run: python -B scripts/build_release.py

      - name: Verify skill release archive
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python -B scripts/build_release.py --verify-only "artifacts/yunoe-v${version}.zip"

      - name: Upload verified skill release
        uses: actions/upload-artifact@v4
        with:
          name: yunoe-skill-release
          path: artifacts/yunoe-v*.zip
          if-no-files-found: error
