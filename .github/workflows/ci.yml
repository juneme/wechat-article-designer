name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate skill package and v4 regressions
        run: python scripts/quick_validate.py .

      - name: Parse scripts without cache output
        run: python -B -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('scripts').glob('*.py')]"

      - name: Lint Python
        run: python -m ruff check --no-cache .

      - name: Audit release hygiene
        run: python -B scripts/audit_release_hygiene.py .
